name: Collect trackers

on:
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      limit_artists:
        description: "How many developers to expand (0 = all)"
        default: "20"
  schedule:
    - cron: "17 3 * * *"      # daily at 03:17 UTC (06:17 Kyiv), off-peak minute

permissions:
  contents: write             # allow the bot to commit data

concurrency:
  group: collect              # never run two collectors at the same time
  cancel-in-progress: false   # queue the new run instead of killing the current one

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Run collector
        env:
          # manual run uses the input; scheduled run expands all developers
          LIMIT_ARTISTS: ${{ github.event.inputs.limit_artists || '0' }}
        run: bash collect.sh

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # commit only if data actually changed
          git diff --staged --quiet || git commit -m "data: $(date -u +%F)"
          # pick up commits pushed while the job was running
          git pull --rebase
          git push
